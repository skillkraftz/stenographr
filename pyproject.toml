[project]
name = "stenographr"
version = "0.1.0"
description = "Local speech-to-text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sherpa-onnx>=1.12", "numpy"]

[project.scripts]
stenographr = "stenographr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stenographr"]
