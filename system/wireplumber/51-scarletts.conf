# Two Scarlett 2i2s on the Dell dock, told apart by USB product ID instead of by detection order.
# (WirePlumber 1.x, SPA-JSON. Rules are applied AFTER WirePlumber has picked its own names, so they win.)
#
#   mic  2i2  1235:8016   -> device "scarlett-mic",  Pro Audio, input node "scarlett-mic" (default input)
#   main 2i2  1235:8202   -> device "scarlett-main", profile HiFi (as before), default output
#
# The product ID is fixed by the hardware, so it does not change on replug, reboot or dock port.
# (Only works while the two cards are different models; if both were 8016 the match would have to be the port.)
# Fixed device names also fix the keys WirePlumber uses in ~/.local/state/wireplumber/.

monitor.alsa.rules = [
  # ---- mic 2i2: device
  {
    matches = [ { device.vendor.id = "0x1235"  device.product.id = "0x8016" } ]
    actions = {
      update-props = {
        device.name        = "scarlett-mic"
        device.nick        = "scarlett-mic"
        device.description = "scarlett-mic"
        device.profile     = "pro-audio"
      }
    }
  }
  # ---- mic 2i2: input node (nodes carry alsa.components = "USB<vendor>:<product>")
  {
    matches = [
      { alsa.components = "USB1235:8016"  media.class = "Audio/Source" }
    ]
    actions = {
      update-props = {
        node.name        = "scarlett-mic"
        node.nick        = "scarlett-mic"
        node.description = "Scarlett mic"
        # highest-priority source => default input (WirePlumber picks the default by priority.session
        # unless a different default was set by hand and stored in default-nodes)
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }

  # ---- main 2i2: device (profile stays HiFi, outputs untouched)
  {
    matches = [ { device.vendor.id = "0x1235"  device.product.id = "0x8202" } ]
    actions = {
      update-props = {
        device.name        = "scarlett-main"
        device.nick        = "scarlett-main"
        device.description = "Scarlett main"
        device.profile     = "HiFi"
      }
    }
  }
]
